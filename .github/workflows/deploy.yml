name: 🚀 Deploy to Seelf

on:
  push:
    branches:
      - minimalistic   # or "production" / your deploy branch

jobs:
  deploy:
    name: Deploy to Seelf
    runs-on: ubuntu-latest

    steps:
      # Step 1 — Checkout your repository
      - name: 🧾 Checkout code
        uses: actions/checkout@v4

      # Step 2 — Trigger Seelf deployment
      - name: 🚀 Deploy via Seelf
        uses: YuukanOO/seelf-deploy-action@v1
        with:
          api_url: ${{ secrets.SEELF_API_URL }}
          api_key: ${{ secrets.SEELF_API_KEY }}
          app_id: ${{ secrets.SEELF_APP_ID }}
          environment: production
          git_branch: ${{ github.ref_name }}
          git_hash: ${{ github.sha }}
